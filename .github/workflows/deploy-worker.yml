name: Deploy Worker (other-api)

# Auto-deploys the server/ Cloudflare Worker on every push that touches it.
# Runs in GitHub's cloud (not the dev sandbox), so it can reach Cloudflare.
# Does nothing until the CLOUDFLARE_API_TOKEN repo secret is set, so it's safe
# to merge before configuration is complete.

on:
  push:
    branches: [main, claude/continue-other-app-ewuf2q]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that Cloudflare credentials are configured
        id: gate
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Apply the D1 schema BEFORE shipping code so new code never runs against a
      # DB missing its tables. schema.sql is all `CREATE TABLE/INDEX IF NOT
      # EXISTS`, so this is idempotent and safe to run on every deploy — it's the
      # only thing that migrates new tables (e.g. reminder_sends) to prod, since
      # `wrangler deploy` ships code only.
      # Applies schema.sql to remote D1 via the D1 /query REST endpoint. We can't
      # use `wrangler d1 execute --file` here — its R2-backed /import path can't
      # authenticate with a scoped CI token (Cloudflare error 10000). See the
      # script header for details. Idempotent (CREATE ... IF NOT EXISTS).
      - name: Apply D1 schema (idempotent migrations)
        if: steps.gate.outputs.ready == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate.mjs

      - name: Deploy with Wrangler
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Not configured yet
        if: steps.gate.outputs.ready != 'true'
        run: echo "Skipping deploy — add CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID) in repo Settings → Secrets and variables → Actions."
