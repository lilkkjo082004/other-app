name = "other-api"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Create the DB once, then paste its id here:
#   wrangler d1 create other
[[d1_databases]]
binding = "DB"
database_name = "other"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Lock CORS to your web app's origin in production, e.g.
#   ALLOWED_ORIGIN = "https://other.example.com"

# Secrets (do NOT put these here) — set with wrangler:
#   wrangler secret put AUTH_SECRET        # long random string for signing tokens
#   wrangler secret put ANTHROPIC_API_KEY  # sk-ant-... (enables POST /ai)
