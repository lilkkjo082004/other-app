name = "other-api"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Create the DB once, then paste its id here:
#   wrangler d1 create other
[[d1_databases]]
binding = "DB"
database_name = "other"
database_id = "13f0f67b-bbc2-432f-82c4-fdb9df3e20ba"

# Public, non-secret config only. These are authoritative: on deploy, Wrangler
# replaces the worker's plain-text vars with exactly this list, so anything set
# in the dashboard that isn't here would be dropped. (None of these are secret —
# the VAPID public key, origin, and mailto are already public in the web build.)
[vars]
ALLOWED_ORIGIN = "https://lilkkjo082004.github.io"
VAPID_PUBLIC = "BF_oz9i57Om2HKGoM_OFSMagZCD8iUmKzRaYLBRbJwkbbBoBePyoE0OFZjnh54CZpk-ub3Z03-acBA60jCn7tS0"
VAPID_SUBJECT = "mailto:lilkkjo082004@gmail.com"
AI_RATE_LIMIT = "30"
AUTH_RATE_LIMIT = "20"
# Natural voices (ElevenLabs) for POST /tts — optional, off unless set:
#   ELEVEN_VOICE_IDS = "id1,id2,id3"
#   ELEVEN_MODEL     = "eleven_turbo_v2_5"

# Secrets are NOT listed here and are preserved across deploys. They must be set
# as Cloudflare *Secrets* (encrypted), not plain-text Variables, or a deploy
# would drop them:
#   AUTH_SECRET        — signs auth tokens (encrypt the existing one if needed!)
#   ANTHROPIC_API_KEY  — sk-ant-… (enables POST /ai)
#   VAPID_PRIVATE      — push check-ins
#   ELEVENLABS_API_KEY — optional, POST /tts

# Companion check-ins. Every 15 min so user-chosen check-in times are honored
# (the scheduled() handler decides per-user whether a time is due).
[triggers]
crons = ["*/15 * * * *"]
